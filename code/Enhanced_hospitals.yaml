  FAC_978:
    additional_name_patterns:
      - "^[A-ZÀ-Ö][a-zà-öø-ÿ]+ [A-ZÀ-Ö][a-zà-öø-ÿ]+-[A-Z]'[A-Z][a-z]+$"
    notes: "Accented first name with hyphenated-apostrophe last name"
  
  # Example: FAC 961 - Ottawa Heart Institute
