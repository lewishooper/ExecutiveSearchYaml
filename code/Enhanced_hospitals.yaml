# HOSPITAL-SPECIFIC OVERRIDES (Phase 2 Addition)
# ============================================================================
# Custom recognition rules for hospitals with unique formatting
# ============================================================================

hospital_overrides:
  
  # Example: FAC 969 - Ontario Shores
  # Issue: "Physician-in-Chief and Research Chair" not recognized
 # FAC 800 - Hawkesbury & District General
  # Issue: "Dr. Paul E. Beaulé" - middle initial with accented last name
  FAC_800:
    additional_name_patterns:
      - "^Dr\\.? [A-Z][a-z]+ [A-Z]\\. [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+$"
    notes: "Dr. with middle initial and accented last name (Beaulé)"
    
  FAC_939:
    additional_name_patterns:
      - "^[A-Z][a-z]+ [A-Z][a-z]+-[A-Z][a-z]+, [A-Z]{2}, [A-Z]{2,}$"  # "Golda Milo-Manson, MD, FRCPC"
    notes: "Hyphenated last name with comma-separated credentials (MD, FRCPC)"

  FAC_910:
    additional_name_patterns:
      - "^[A-Z][a-z]+ [a-z][a-z]+$"  # Allows lowercase last name (Firstname lastname)
    notes: "CEO has improperly capitalized last name on website"

  FAC_837:
    additional_name_exclusions:
