  FAC_969:
    additional_title_keywords:
      - "Physician-in-Chief"
      - "Research Chair"
      - "Personalized Medicine"
      - "Personalized Mental Health Care"
    notes: "Complex multi-part title with 'and' connector"
  
  # Example: FAC 978 - Kingston Health Sciences
