# ============================================================================
# RECOGNITION CONFIGURATION (Phase 2 Addition)
# ============================================================================
# Central configuration for name and title recognition logic
# Used by all 18 pattern scrapers to validate executive names and titles
# ============================================================================

recognition_config:
  
  # Title Keywords - Used by is_executive_title() function
  # These keywords identify executive-level positions
  title_keywords:
    
    # Primary executive keywords (C-suite, Presidents, VPs, etc.)
    primary:
      - CEO
      - Chief
      - President
      - Vice President
      - VP
      - Director
      - Officer
      - Administrator
      - Manager
      - Chair
      - Vice-Chair
      - Vice Chair
      - Medical Staff
      - Nursing Executive
      - CNE
      - CNO
      - CFO
      - COO
      - CMO
      - CIO
      - CHRO
      - Supervisor
      - Health System Executive
      - Strategic Lead
      - President and CEO
      - Executive Vice President
      - Senior Vice President
      - Chief of Staff
    
    # Secondary keywords (Associates, Assistants, Acting positions)
    secondary:
      - Associate
      - Head, Department
      - Assistant
      - Interim
      - Acting
      - Department Head
      - Division Head
      - Physician Lead
      - Senior Leader
      - Executive Director
      - Senior Director
    
    # Medical-specific titles
    medical_specific:
      - Chief of Medicine
      - Chief of Surgery
      - Chief of Emergency
      - Physician-in-Chief
      - Medical Director
      - Department Chair
      - Division Chair
      - Chief Medical Officer
      - Chief Nursing Officer
      - Scientific Officer
      - Research Chair
  
  # Name Exclusions - Patterns that should NOT be considered names
  # Used by is_executive_name() function
  name_exclusions:
    - "^(About|Our|The|Welcome|Contact|Services|Programs|News|Events)\\b"
    - "^(Ontario|Ministry|Government|Hospital|Health|Department)\\b"
    - "^(For Staff|Staff Only|General|Information)\\b"
    - "^Senior Leadership Team$"
    - "^Executive Leadership Team$"
    - "^Board Members$"
    - "^Management Team$"
    - "^Board of Directors$"
    - "^Our Team$"
    - "^Leadership$"
  
  # Title Exclusions - Patterns that should NOT be considered titles
  # Used by is_executive_title() function
  title_exclusions:
    - "powered by"
    - "designed by"
    - "website by"
    - "created by"
    - "developed by"
    - "©"
    - "copyright"
    - "all rights reserved"
     # Medical/Quality Reporting Terms:
    - "Infection Prevention"
    - "C\\. Difficile"
    - "Blood Stream Infection"
    - "Hand Hygiene"
    - "HSMR"
    - "MRSA"
    - "Surgical Safety"
    - "Vancomycin-Resistant"
    - "Ventilator-Associated"
  
  # Fuzzy Matching Configuration (Future enhancement)
  fuzzy_matching:
    enabled: false
    threshold: 0.85
    method: "levenshtein"
  
  # Title Inference Configuration (Future enhancement)
  title_inference:
    enabled: false
    default_titles:
      - "Executive Team Member"
      - "Senior Leader"

