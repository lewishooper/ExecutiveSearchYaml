name_patterns:
  standard:
    - ^[A-Z][a-z]+ [A-Z][a-z]+$
    - ^[A-Z][a-z]+ [A-Z]\. [A-Z][a-z]+$
    - ^[A-Z][a-z]+ [A-Z][a-z]+ [A-Z][a-z]+$
  with_titles:
    - ^Dr\.? [A-Z][a-z]+ [A-Z][a-z]+$
    - ^Dr\.? [A-Z][a-z]+ [A-Z]\. [A-Z][a-z]+$
    - ^Dr\.? [A-Z][a-z]+ Ma?c[A-Z][a-z]+$
    - ^Dr\.? [A-Z][a-z]+ [A-Z][a-z]+ [A-Z][a-z]+$
    - ^Dr\.? [A-Z][a-z]+ Van[A-Z][a-z]+$
    - ^[A-Z][a-z]+ van [A-Z][a-z]+, [A-Z]{2,}$
    - ^[A-Z][a-z]+ (van|de|del|von|di) [A-Z][a-z]+$
    - '^Sr\.? [A-Z][a-z]+ [A-Z][a-z]+$'
    - '^Sr\.? [A-Z][a-z]+ [A-Z]\. [A-Z][a-z]+$'
    - ^(Mr|Ms|Mrs|Miss)\.? [A-Z][a-z]+ [A-Z][a-z]+$
    - ^(Mr|Ms|Mrs|Miss)\.? [A-Z][a-z]+ [A-Z]\. [A-Z][a-z]+$
    - ^(Mr|Ms|Mrs|Miss)\.? [A-Z][a-z]+ [A-Z][a-z]+ [A-Z][a-z]+$
        - ^Email (Mr|Ms|Mrs|Miss|Dr|Sr)\.? [A-Z][a-z]+ [A-Z][a-z]+$
    - ^Email (Mr|Ms|Mrs|Miss|Dr|Sr)\.? [A-Z][a-z]+ [A-Z]\. [A-Z][a-z]+$
    - ^Email (Mr|Ms|Mrs|Miss|Dr|Sr)\.? [A-Z][a-z]+ [A-Z][a-z]+ [A-Z][a-z]+$
    - ^Email (Mr|Ms|Mrs|Miss|Dr|Sr)\.? [A-Z][a-z]+ [A-Z][a-z]+-[A-Z][a-z]+$
    - ^[A-Z][a-z]+ [A-Z][a-z]+,\s+(Senior\s+)?Vice\s+President$
    - ^[A-Z][a-z]+ [A-Z][a-z]+,\s+(Senior\s+)?(Vice\s+)?President$
    - ^[A-Z][a-z]+ [A-Z][a-z]+,.*$
    
  with_credentials:
    - ^Dr\.? [A-Z][a-z]+ [A-Z]?\. [A-Z][a-z]+,? [A-Z]{2,}.*$
    - ^[A-Z][a-z]+ [A-Z][a-z]+,? [A-Z]{2,}.*$
    - ^Dr\.?\s+[A-Z][a-z]+\s+[A-Z][a-z]+,?\s+[A-Z]{2,},?\s+[A-Z]{2,}.*$
    - ^[A-Z][a-z]+ [A-Z]\. [A-Z][a-z]+, [A-Z]{2,}.*$
    - ^[A-Z][a-z]+ [A-Z][a-z]+ [A-Z][a-z]+,? [A-Z]{2,}.*$
  hyphenated_names:
    - ^[A-Z][a-z]+-[A-Z][a-z]+ [A-Z][a-z]+$
    - ^[A-Z][a-z]+ [A-Z][a-z]+-[A-Z][a-zA-Z]+$
    - ^Dr\.? [A-Z][a-z]+ [A-Z][a-z]+-[A-Z][a-z]+$
    - ^[A-Z][a-z]+-[A-Z][a-z]+ [A-Z][a-z]+,? [A-Z]{2,}.*$
    # ADD THESE NEW PATTERNS FOR ACCENTED HYPHENATED NAMES:
    - ^[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+-[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-Z][a-z]+$                    # Marc-André Morency
    - ^Dr\.? [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+-[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-Z][a-z]+$              # Dr. Marc-André Morency
    - ^[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+-[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+$      # Marie-Claire Beauchemin
    - ^Dr\.? [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+-[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+$ # Dr. Jean-Philippe Leblanc
  complex_credentials:
    - ^[A-Z][a-z]+ [A-Z][a-z]+,? [A-Z]\.[A-Z][a-z]+\.,? [A-Z]{2,}.*$
    - ^Dr\.? [A-Z]\. [A-Z][a-z]+ [A-Z][a-z]+$
    - ^[A-Z][a-z]+-[A-Z][a-z]+ [A-Z][a-z]+-[A-Z][a-z]+$
  internal_capitals:
    - ^[A-Z][a-z]+ [A-Z][a-z]*[A-Z][a-z]+$
    - ^[A-Z][a-z]+ Mc[A-Z][a-z]+$
    - ^[A-Z][a-z]+ O'[A-Z][a-z]+$
    - ^[A-Z][a-z]+ De[A-Z][a-z]+$
    - ^[A-Z][a-z]+ [A-Z]'[A-Z][a-z]+$
    - ^[A-Z][a-z]+ Van[A-Z][a-z]+$ 
    - ^[A-Z][a-z]+ La[A-Z][a-z]+$
    - ^Dr\.? [A-Z][a-z]+ van [A-Z][a-z]+$
  accented_names:
    # Two-part names with accents
    - ^[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+$
    # French Canadian patterns (safe, structured)
    - ^[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+$
    - ^Dr\.? [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+ [A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]+$
